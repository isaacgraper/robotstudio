[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-canvas"
version = "0.1.0"
description = "Visual, config-driven authoring and execution for Robot Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robot Canvas Contributors" }]
keywords = ["robotframework", "blockly", "hil", "test-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115",
  "loguru>=0.7.3",
  "pydantic>=2.6",
  "robotframework>=7.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
robot-canvas = "robot_canvas.cli:main"
robotcanvas = "robot_canvas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robot_canvas*"]

[tool.setuptools.package-data]
robot_canvas = ["py.typed", "web_dist/**/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["robot_canvas"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["web", "src/robot_canvas/web_dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
