[project]
name = "robotstudio"
version = "0.1.0"
description = "Visual authoring and execution environment for Robot Framework suites"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
authors = [{ name = "Isaac Kleimmann Graper", email = "isaackleimmanngraper@gmail.com" }]
keywords = [
  "robotframework",
  "blockly",
  "test-automation",
  "hil",
  "no-code",
  "visual-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Robot Framework",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115",
  "loguru>=0.7.3",
  "pydantic>=2.6",
  "robotframework>=7.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
robotstudio = "robotstudio.cli:main"

[project.urls]
Homepage = "https://github.com/isaacgraper/robotstudio"
Repository = "https://github.com/isaacgraper/robotstudio"
Issues = "https://github.com/isaacgraper/robotstudio/issues"
Changelog = "https://github.com/isaacgraper/robotstudio/blob/main/CHANGELOG.md"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "robotstudio", from = "src" }]
include = [
    { path = "src/robotstudio/web_dist", format = ["sdist", "wheel"] },
    { path = "CHANGELOG.md", format = ["sdist"] },
]

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27"
mypy = ">=1.10"
pre-commit = ">=3.7"
pytest = ">=8.0"
ruff = ">=0.5"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["robotstudio"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["web", "src/robotstudio/web_dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
