name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install "poetry>=2.0,<3.0"
      - name: Install dependencies
        run: poetry install --all-extras
      - name: Lint
        run: poetry run ruff check src tests
      - name: Format check
        run: poetry run ruff format --check src tests
      - name: Type check
        run: poetry run mypy src
      - name: Test
        run: poetry run pytest tests -q

  editable-install:
    name: Editable install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install "poetry>=2.0,<3.0"
      - name: Install in editable mode
        run: poetry install --all-extras --editable
      - name: Smoke test editable install
        run: |
          python -m robotstudio --version
          python -m robotstudio init --workspace /tmp/ws --force
          python -m robotstudio validate /tmp/ws/robotstudio-demo.canvas.json --dry-run
          python -m robotstudio run robotstudio-demo --workspace /tmp/ws

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build

  package:
    name: Build and check distribution
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          rm -rf ../src/robotstudio/web_dist
          cp -r dist ../src/robotstudio/web_dist
      - name: Install Poetry and twine
        run: pip install "poetry>=2.0,<3.0" twine
      - name: Build
        run: poetry build
      - name: Check metadata
        run: twine check dist/*
      - name: Install the wheel and smoke test
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/robotstudio --version
          /tmp/verify/bin/robotstudio init --workspace /tmp/ws --force
          /tmp/verify/bin/robotstudio validate /tmp/ws/robotstudio-demo.canvas.json --dry-run
          /tmp/verify/bin/robotstudio run robotstudio-demo --workspace /tmp/ws
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: robotstudio:ci
