services:
  robotstudio:
    build:
      context: .
      dockerfile: Dockerfile
    image: robotstudio:latest
    container_name: robotstudio
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
    environment:
      - ROBOTSTUDIO_WORKSPACE=/workspace
    restart: unless-stopped

  # Hot-reloading Vite dev server. Not needed for normal use:
  #   docker compose --profile dev up
  web:
    profiles: ["dev"]
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - robotstudio
    restart: unless-stopped
